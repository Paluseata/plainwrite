# Builds both Android editions (English and Multilingual) as debug APKs on GitHub's machines.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.4.
# The APKs appear under the run's Artifacts. Debug APKs install on any device with
# "Install unknown apps" allowed; they are not signed for the Play Store.
name: Build Android app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo has no Gradle wrapper jar, so this installs Gradle 8.7 (the version the project asks for).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build englishDebug and multilingualDebug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plainwrite-android
          path: android/app/build/outputs/apk/**/*.apk
