# Builds both Android editions (English and Multilingual) as debug APKs on GitHub's machines.
# Runs by itself whenever android/ or this workflow changes on main, and checks pull requests too.
# You can also run it from the Actions tab ("Run workflow"), or push a tag like v1.0.8.
# The APKs appear under the run's Artifacts; for a tag, they're also attached to that tag's GitHub release.
# Debug APKs install on any device with
# "Install unknown apps" allowed; they are not signed for the Play Store.
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-android.yml']

# a newer push cancels a build of the same branch that's still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # lets a tag build attach the APKs to its release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo has no Gradle wrapper jar, so this installs Gradle 8.7 (the version the project asks for).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build englishDebug and multilingualDebug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plainwrite-android
          path: android/app/build/outputs/apk/**/*.apk

      - name: Name the APKs for the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          v="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/english/debug/*.apk "release/Plainwrite-English_${v}_android.apk"
          cp app/build/outputs/apk/multilingual/debug/*.apk "release/Plainwrite-Multilingual_${v}_android.apk"

      - name: Attach the APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/release/*.apk
