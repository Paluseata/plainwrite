# Builds both desktop editions (English and Multilingual) for Linux, Windows and macOS on GitHub's machines.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.4.
# The installers appear under the run's Artifacts.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Bundle the Google-hosted fonts so the app works offline
        run: python tools/fetch_fonts.py
        continue-on-error: true

      - run: npm install
      - run: npm run build
      - run: npm run build:multilingual

      - uses: actions/upload-artifact@v4
        with:
          name: plainwrite-desktop-${{ runner.os }}
          path: |
            tauri/src-tauri/target/release/bundle/deb/*.deb
            tauri/src-tauri/target/release/bundle/rpm/*.rpm
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/release/bundle/msi/*.msi
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
