# Builds both desktop editions (English and Multilingual) for Linux, Windows and macOS on GitHub's machines.
# Runs by itself whenever tauri/ or this workflow changes on main, and checks pull requests too.
# You can also run it from the Actions tab ("Run workflow"), or push a tag like v1.0.8.
# The installers appear under the run's Artifacts.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['tauri/**', '.github/workflows/build-desktop.yml']
  pull_request:
    paths: ['tauri/**', '.github/workflows/build-desktop.yml']

# a newer push cancels a build of the same branch that's still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - run: npm install
      - run: npm run build
      - name: Keep the English installers
        shell: bash
        run: mkdir -p out/english && cp -r src-tauri/target/release/bundle/. out/english/ && rm -rf src-tauri/target/release/bundle
      - run: npm run build:multilingual
      - name: Keep the Multilingual installers
        shell: bash
        run: mkdir -p out/multilingual && cp -r src-tauri/target/release/bundle/. out/multilingual/

      - uses: actions/upload-artifact@v4
        with:
          name: plainwrite-${{ runner.os }}
          path: |
            tauri/out/*/deb/*.deb
            tauri/out/*/rpm/*.rpm
            tauri/out/*/appimage/*.AppImage
            tauri/out/*/msi/*.msi
            tauri/out/*/nsis/*.exe
            tauri/out/*/dmg/*.dmg
          if-no-files-found: ignore
