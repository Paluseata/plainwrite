# Publishes the web app (PWA) on GitHub Pages whenever pwa/ changes on main:
#   https://<user>.github.io/<repo>/english/  and  https://<user>.github.io/<repo>/multilingual/
# One-time setup: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pwa/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r pwa/english _site/english
          cp -r pwa/multilingual _site/multilingual
          rm -f _site/*/README.md
          cp pwa/index.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
